              icon: "\U0001F35C"
              action: "set:item_name=Mee Goreng|item_price=5.00"
            - label: "{{l10n.preset_nasi_goreng}}"
              icon: "\U0001F372"
              action: "set:item_name=Nasi Goreng|item_price=5.50"
      - text_label:
          text: "{{l10n.rekod_custom_heading}}"
          style: body
      - text_input:
          bind: item_name
          hint: "{{l10n.rekod_item_hint}}"
      - text_input:
          bind: item_qty
          hint: "{{l10n.rekod_qty_hint}}"
          input_type: number
      - text_input:
          bind: item_price
          hint: "{{l10n.rekod_price_hint}}"
          input_type: number
      - action_button:
          label: "{{l10n.rekod_button}}"
          action: "ask:Rekod jualan warung hari ini. Item: {{item_name}}, Bilangan: {{item_qty}}, Harga: RM{{item_price}} seunit. Kira jumlah untuk item ini, tunjukkan pengiraan, dan beri ringkasan harian. Format sebagai jadual ringkas."
          style: primary
      - markdown_output:
          source: ai_response
          streaming: true
  - id: kira_untung
    title: "{{l10n.kira_title}}"
    body:
      - text_label:
          text: "{{l10n.kira_heading}}"
          style: subheading
      - slider:
          bind: calc_jualan
          label: "{{l10n.kira_jualan_label}}"
          min: 0
          max: 5000
          step: 50
      - slider:
          bind: calc_kos
          label: "{{l10n.kira_kos_label}}"
          min: 0
          max: 5000
          step: 50
      - text_input:
          bind: calc_pelanggan
          hint: "{{l10n.kira_pelanggan_label}}"
          input_type: number
      - text_input:
          bind: include_sst
          label: "{{l10n.kira_sst}}"
          input_type: toggle
      - action_button:
          label: "{{l10n.kira_button}}"
          action: "formula:profit;formula:margin"
          style: primary
          hidden_if: "include_sst"
      - action_button:
          label: "{{l10n.kira_button}}"
          action: "formula:profit_sst;formula:margin"
          style: primary
          visible_if: "include_sst"
      - metric_card:
          source: calc_result
          label: "{{l10n.kira_result_label}}"
          prefix: "RM "
          visible_if: calc_result
      - metric_card:
          source: calc_margin
          label: "{{l10n.kira_margin_label}}"
          suffix: "%"
          visible_if: calc_result
      - action_button:
          label: "{{l10n.kira_ai_button}}"
          action: "ask:Analyse my warung finances today. Sales: RM{{calc_jualan}}, Costs: RM{{calc_kos}}, Customers: {{calc_pelanggan}}, Net profit: RM{{calc_result}}, Margin: {{calc_margin}}%. Give me insights: is this healthy? How does it compare to typical warung margins (30-50%)? Any tips to improve?"
          style: secondary
          visible_if: calc_result
      - markdown_output:
          source: ai_response
          streaming: true
  - id: imbas_hutang
    title: "{{l10n.hutang_title}}"
    body:
      - text_label:
          text: "{{l10n.hutang_heading}}"
          style: subheading
      - camera_input:
          bind: photo_path
      - text_input:
          bind: user_text
          hint: "{{l10n.hutang_hint}}"
      - action_button:
          label: "{{l10n.hutang_button}}"
          action: "vision_ask:Analisis gambar buku hutang (Buku 555) ini. Senaraikan: 1) Nama penghutang, 2) Jumlah hutang (dalam RM), 3) Tarikh hutang jika ada, 4) Status (belum bayar / separuh bayar). Akhir sekali, beri jumlah keseluruhan hutang tertunggak. Format sebagai jadual."
          style: primary
          visible_if: "photo_path"
      - action_button:
          label: "{{l10n.hutang_button}}"
          action: "ask:Bantu saya menganalisis rekod hutang warung saya. Maklumat: {{user_text}}. Tolong senaraikan nama, jumlah, dan cadangan peringatan pembayaran. Format sebagai jadual."
          style: primary
          hidden_if: "photo_path"
      - markdown_output:
          source: ai_response
          streaming: true
  - id: tanya_kira
    title: "{{l10n.tanya_title}}"
    body:
      - text_label:
          text: "{{l10n.tanya_title}}"
          style: subheading
      - voice_input:
          bind: user_text
          hint: "{{l10n.tanya_voice_hint}}"
      - text_input:
          bind: user_text
          hint: "{{l10n.tanya_text_hint}}"
      - action_button:
          label: "{{l10n.tanya_button}}"
          action: "ask:{{user_text}}"
          style: primary
      - markdown_output:
          source: ai_response
          streaming: true
permissions:
  - camera

triage:
  home_mode: "grid"
  max_clarifications: 2
  fallback: "tanya_kira"
