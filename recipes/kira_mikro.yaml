variables:
  user_text: { type: string, default: "" }
  ai_response: { type: string, default: "" }
  photo_path: { type: string, default: "" }
  item_name: { type: string, default: "" }
  item_qty: { type: string, default: "" }
  item_price: { type: string, default: "" }
  calc_jualan: { type: number, default: "0" }
  calc_kos: { type: number, default: "0" }
  calc_pelanggan: { type: string, default: "" }
  calc_result: { type: number, default: "0" }
  calc_margin: { type: number, default: "0" }
  calc_per_cust: { type: number, default: "0" }
  include_sst: { type: string, default: "false" }
formulas:
  profit:
    expression: "{{calc_jualan}} - {{calc_kos}}"
    output: calc_result
  profit_sst:
    expression: "({{calc_jualan}} - {{calc_kos}}) * (1 - 6 / 100)"
    output: calc_result
  margin:
    expression: "{{calc_jualan}} > 0 ? (({{calc_jualan}} - {{calc_kos}}) / {{calc_jualan}}) * 100 : 0"
    output: calc_margin
