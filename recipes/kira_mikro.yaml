    title: "Home"
    icon: "\U0001F3E0"
  - id: rekod_jualan
    title: "Rekod"
    icon: "\U0001F4DD"
  - id: kira_untung
    title: "Untung"
    icon: "\U0001F4B5"
  - id: imbas_hutang
