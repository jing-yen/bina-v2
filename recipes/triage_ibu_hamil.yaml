variables:
  user_text: { type: string, default: "" }
  ai_response: { type: string, default: "" }
  bp_systolic: { type: number, default: "120" }
  gestational_weeks: { type: number, default: "28" }
  has_edema: { type: string, default: "false" }
  has_headache: { type: string, default: "false" }
  reduced_movement: { type: string, default: "false" }
  vaginal_bleeding: { type: string, default: "false" }
  user_location: { type: string, default: "" }
  checklist_step: { type: number, default: "0" }

screens:
  - id: home
    title: ""
    body:
      - text_label:
          text: "{{l10n.home_heading}}"
          style: subheading
      - macro_grid:
          columns: 2
          buttons:
            - label: "{{l10n.grid_saringan}}"
              icon: "\U0001FA7A"
              action: "go:saringan"
            - label: "{{l10n.grid_checklist}}"
              icon: "✅"
              action: "go:senarai_semak"
            - label: "{{l10n.grid_ambulans}}"
              icon: "\U0001F691"
              action: "go:panggil_ambulans"
            - label: "{{l10n.grid_rujukan}}"
              icon: "\U0001F4CB"
              action: "go:rujukan_cepat"
  - id: saringan
    title: "{{l10n.saringan_title}}"
    body:
      - text_label:
          text: "{{l10n.saringan_title}}"
          style: subheading
      - slider:
          bind: bp_systolic
          min: 60
          max: 200
          step: 5
          label: "{{l10n.bp_label}}"
          left_label: "60"
          right_label: "200"
          show_value: true
      - text_input:
          bind: gestational_weeks
          hint: "{{l10n.gest_weeks_hint}}"
          input_type: number
      - text_input:
          bind: has_edema
          label: "{{l10n.edema_label}}"
          input_type: toggle
      - text_input:
          bind: has_headache
          label: "{{l10n.headache_label}}"
          input_type: toggle
      - text_input:
          bind: reduced_movement
          label: "{{l10n.movement_label}}"
          input_type: toggle
      - text_input:
          bind: vaginal_bleeding
          label: "{{l10n.bleeding_label}}"
          input_type: toggle
      - action_button:
          label: "{{l10n.triage_button}}"
          action: "ask:Triage maternal patient. BP systolic: {{bp_systolic}} mmHg. Gestational age: {{gestational_weeks}} weeks. Edema: {{has_edema}}. Severe headache: {{has_headache}}. Reduced fetal movement: {{reduced_movement}}. Vaginal bleeding: {{vaginal_bleeding}}. Assess risk level (LOW/MEDIUM/HIGH/EMERGENCY). If HIGH or EMERGENCY, list immediate actions. Always state whether referral to hospital is needed."
          style: primary
      - markdown_output:
          source: ai_response
          streaming: true
  - id: senarai_semak
    title: "{{l10n.checklist_title}}"
    body:
      - text_label:
          text: "{{l10n.checklist_title}}"
          style: subheading
      - checklist_items:
          bind: checklist_step
          items:
            - label: "{{l10n.check_airway}}"
              type: text
            - label: "{{l10n.check_bp}}"
              type: text
            - label: "{{l10n.check_bleeding}}"
              type: text
            - label: "{{l10n.check_iv}}"
              type: text
            - label: "{{l10n.check_contact}}"
              type: text
            - label: "{{l10n.check_transport}}"
              type: text
      - progress_bar:
          bind: checklist_step
          total: 6
      - action_button:
          label: "{{l10n.checklist_title}}"
          action: "increment:checklist_step"
          style: primary
  - id: panggil_ambulans
    title: "{{l10n.ambulans_title}}"
    body:
      - text_label:
          text: "{{l10n.ambulans_title}}"
          style: subheading
      - text_label:
          text: "{{l10n.ambulans_desc}}"
          style: body
      - action_button:
          label: "{{l10n.call_999}}"
          action: "tel:999"
          style: danger
      - action_button:
          label: "{{l10n.call_hospital}}"
          action: "tel:+6097482000"
          style: danger
      - action_button:
          label: "{{l10n.sms_emergency}}"
          action: "sms:999:KECEMASAN IBU HAMIL. Lokasi: {{user_location}}. BP: {{bp_systolic}} mmHg. Umur kandungan: {{gestational_weeks}} minggu."
          style: secondary
  - id: rujukan_cepat
    title: "{{l10n.rujukan_title}}"
    body:
      - text_label:
          text: "{{l10n.rujukan_title}}"
          style: subheading
      - voice_input:
          bind: user_text
          hint: "{{l10n.rujukan_voice_hint}}"
      - text_input:
          bind: user_text
          hint: "{{l10n.rujukan_text_hint}}"
      - action_button:
          label: "{{l10n.rujukan_button}}"
          action: "ask:{{user_text}}"
          style: primary
      - markdown_output:
          source: ai_response
          streaming: true
