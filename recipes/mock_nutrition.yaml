variables:
  user_text: { type: string, default: "" }
  ai_response: { type: string, default: "" }
  child_age_months: { type: number, default: "24" }
  child_weight: { type: string, default: "" }
  child_height: { type: string, default: "" }
  child_sex: { type: string, default: "" }
  breastfeeding: { type: string, default: "false" }
  diet_age: { type: string, default: "" }
  growth_step: { type: number, default: "0" }
screens:
  - id: home
    title: ""
    body:
      - text_label:
          text: "{{l10n.home_heading}}"
          style: subheading
      - macro_grid:
          columns: 2
          buttons:
            - label: "{{l10n.grid_screen}}"
              icon: "\U0001F4CA"
              action: "go:screening"
            - label: "{{l10n.grid_diet}}"
              icon: "\U0001F957"
              action: "go:diet_guide"
            - label: "{{l10n.grid_growth}}"
              icon: "\U0001F4C8"
              action: "go:growth_track"
            - label: "{{l10n.grid_hotline}}"
              icon: "\U0001F3E5"
              action: "go:hotline"
  - id: screening
    title: "{{l10n.screen_title}}"
    body:
      - text_label:
          text: "{{l10n.screen_heading}}"
          style: subheading
      - slider:
          bind: child_age_months
          min: 0
          max: 60
          step: 1
          label: "{{l10n.screen_age_hint}}"
          left_label: "{{l10n.screen_age_left}}"
          right_label: "{{l10n.screen_age_right}}"
          show_value: true
      - text_input:
          bind: child_weight
          hint: "{{l10n.screen_weight_hint}}"
      - text_input:
          bind: child_height
          hint: "{{l10n.screen_height_hint}}"
      - text_input:
          bind: child_sex
          hint: "{{l10n.screen_sex_hint}}"
          input_type: dropdown
          options:
            - "Lelaki (Male)"
            - "Perempuan (Female)"
      - text_input:
          bind: breastfeeding
          label: "{{l10n.screen_breastfeed}}"
          input_type: toggle
      - action_button:
          label: "{{l10n.screen_button}}"
          action: "ask:You are a child nutrition screener using WHO growth standards. Assess nutritional status for: Age: {{child_age_months}} months, Weight: {{child_weight}} kg, Height: {{child_height}} cm, Sex: {{child_sex}}, Still breastfeeding: {{breastfeeding}}. Provide: 1) Expected WHO median weight and height for this age/sex, 2) Estimated Z-score range (rough estimate), 3) Nutritional status classification (Normal / Underweight / Wasting / Stunting / Overweight), 4) If MUAC not provided, note it should be checked, 5) Recommended action (Monitor at home / Follow up in 1 month / Refer clinic urgently / SAM protocol). Note: If weight appears critically low for age, flag as SAM and advise immediate clinic referral."
          style: primary
      - markdown_output:
          source: ai_response
          streaming: true
  - id: diet_guide
    title: "{{l10n.diet_title}}"
    body:
      - text_label:
          text: "{{l10n.diet_title}}"
          style: subheading
      - text_input:
          bind: diet_age
          hint: "{{l10n.diet_age_hint}}"
          input_type: dropdown
          options:
            - "0-6 bulan (0-6 months)"
            - "6-9 bulan (6-9 months)"
            - "9-12 bulan (9-12 months)"
            - "1-2 tahun (1-2 years)"
            - "2-5 tahun (2-5 years)"
      - text_input:
          bind: user_text
          hint: "{{l10n.diet_concern_hint}}"
      - action_button:
          label: "{{l10n.diet_button}}"
          action: "ask:You are a child dietitian for rural Malaysia. Child's age group: {{diet_age}}. Provide: 1) Recommended feeding pattern for this age (frequency, texture, portion size), 2) Key nutrients needed (iron, zinc, vitamin A, calcium), 3) Affordable Malaysian foods to include (bubur nasi, ikan bilis, sayur, tauhu, telur, buah-buahan tempatan), 4) Foods to avoid for this age, 5) Red flags to watch for (not eating, weight loss, listless). Answer parent's concern: {{user_text}}"
          style: primary
      - markdown_output:
          source: ai_response
          streaming: true
  - id: growth_track
    title: "{{l10n.growth_title}}"
    body:
      - text_label:
          text: "{{l10n.growth_heading}}"
          style: subheading
      - checklist_items:
          bind: growth_step
          items:
            - label: "{{l10n.growth_step1}}"
              type: text
            - label: "{{l10n.growth_step2}}"
              type: text
            - label: "{{l10n.growth_step3}}"
              type: text
            - label: "{{l10n.growth_step4}}"
              type: text
            - label: "{{l10n.growth_step5}}"
              type: text
            - label: "{{l10n.growth_step6}}"
              type: text
      - progress_bar:
          bind: growth_step
          total: 6
      - action_button:
          label: "{{l10n.growth_next}}"
          action: "increment:growth_step"
          style: primary
      - action_button:
          label: "{{l10n.growth_summary}}"
          action: "ask:Generate a brief child growth monitoring report. Child age: {{child_age_months}} months, Weight: {{child_weight}} kg, Height: {{child_height}} cm. All 6 monitoring steps completed. Provide: 1) Growth monitoring summary, 2) Nutritional status estimate, 3) Key dietary recommendations for this age, 4) Next visit recommendation (monthly/bi-monthly/urgent). Format as a brief clinic note."
          style: secondary
          visible_if: "growth_step >= 6"
      - markdown_output:
          source: ai_response
          streaming: true
  - id: hotline
    title: "{{l10n.hotline_title}}"
    body:
      - text_label:
          text: "{{l10n.hotline_title}}"
          style: subheading
      - text_label:
          text: "{{l10n.hotline_subtext}}"
          style: body
      - action_button:
          label: "{{l10n.hotline_locate}}"
          action: "geolocate"
          style: secondary
      - geo_display:
          data: "health_clinics"
          limit: 5
          show_distance: true
      - action_button:
          label: "{{l10n.hotline_call}}"
          action: "tel:+60154321234"
          style: primary
permissions:
  - location
