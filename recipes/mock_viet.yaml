  user_text: { type: string, default: "" }
  ai_response: { type: string, default: "" }
  photo_path: { type: string, default: "" }
  crop_type: { type: string, default: "" }
  farming_region: { type: string, default: "" }
  market_crop: { type: string, default: "" }
  expected_yield: { type: string, default: "" }
screens:
  - id: home
    title: ""
    body:
      - text_label:
          text: "{{l10n.home_heading}}"
          style: subheading
      - macro_grid:
          columns: 2
          buttons:
            - label: "{{l10n.grid_diagnose}}"
              icon: "\U0001F4F8"
              action: "go:diagnose"
            - label: "{{l10n.grid_weather}}"
              icon: "\U0001F4C5"
              action: "go:season"
            - label: "{{l10n.grid_market}}"
              icon: "\U0001F4B9"
              action: "go:market"
            - label: "{{l10n.grid_ask}}"
              icon: "\U0001F4AC"
              action: "go:ask_expert"
  - id: diagnose
    title: "{{l10n.diagnose_title}}"
    body:
      - text_label:
          text: "{{l10n.diagnose_heading}}"
          style: subheading
      - camera_input:
          bind: photo_path
      - voice_input:
          bind: user_text
          hint: "{{l10n.diagnose_voice_hint}}"
      - text_input:
          bind: user_text
          hint: "{{l10n.diagnose_text_hint}}"
      - action_button:
          label: "{{l10n.diagnose_button}}"
          action: "vision_ask:You are a Vietnamese crop pathologist. Analyze this photo and identify: 1) Crop species visible, 2) Disease or pest name (use both Vietnamese and scientific names), 3) Severity (nhẹ/trung bình/nặng), 4) Immediate treatment using locally available pesticides/fungicides sold in Vietnam, 5) Prevention for rest of field, 6) Whether to contact local khuyến nông. Farmer notes: {{user_text}}"
          style: primary
          visible_if: "photo_path"
      - action_button:
          label: "{{l10n.diagnose_button}}"
          action: "ask:You are a Vietnamese crop pathologist. Based on the farmer's description, diagnose the most likely disease or pest problem. Use Vietnamese crop disease names. Give: 1) Most probable diagnosis, 2) Severity assessment, 3) Immediate treatment with locally available products in Vietnam, 4) Prevention measures, 5) Whether to contact khuyến nông. Description: {{user_text}}"
          style: primary
          hidden_if: "photo_path"
      - markdown_output:
          source: ai_response
          streaming: true
  - id: season
    title: "{{l10n.season_title}}"
    body:
      - text_label:
          text: "{{l10n.season_heading}}"
          style: subheading
      - text_input:
          bind: crop_type
          hint: "{{l10n.season_crop_hint}}"
          input_type: dropdown
          options:
            - "Lúa (Rice)"
            - "Cà phê (Coffee)"
            - "Cao su (Rubber)"
            - "Thanh long (Dragon fruit)"
            - "Xoài (Mango)"
            - "Nhãn (Longan)"
            - "Dừa (Coconut)"
            - "Mía (Sugarcane)"
            - "Rau màu (Vegetables)"
      - text_input:
          bind: farming_region
          hint: "{{l10n.season_region_hint}}"
          input_type: dropdown
          options:
            - "ĐBSCL — Đồng bằng sông Cửu Long (Mekong Delta)"
            - "Đông Nam Bộ (Southeast)"
            - "Tây Nguyên (Central Highlands)"
            - "Đồng bằng sông Hồng (Red River Delta)"
            - "Miền Trung (Central Vietnam)"
      - action_button:
          label: "{{l10n.season_button}}"
          action: "ask:You are a Vietnamese agricultural extension advisor. Crop: {{crop_type}}, Region: {{farming_region}}. Provide a practical seasonal calendar: 1) Key growing seasons for this crop in this region, 2) Land preparation timing, 3) Planting window (optimal months), 4) Key crop management stages (irrigation, fertilizer, pest monitoring), 5) Harvest period, 6) Post-harvest storage tips, 7) Current month challenges if applicable (salinity, flooding, drought). Be specific to Vietnamese conditions."
          style: primary
      - markdown_output:
          source: ai_response
          streaming: true
  - id: market
    title: "{{l10n.market_title}}"
    body:
      - text_label:
          text: "{{l10n.market_heading}}"
          style: subheading
      - text_input:
          bind: market_crop
          hint: "{{l10n.market_crop_hint}}"
          input_type: dropdown
          options:
            - "Lúa gạo (Rice)"
            - "Cà phê (Coffee)"
            - "Cao su (Rubber)"
            - "Thanh long (Dragon fruit)"
            - "Xoài (Mango)"
            - "Tôm (Shrimp)"
            - "Cá tra (Pangasius)"
            - "Điều (Cashew)"
      - text_input:
          bind: expected_yield
          hint: "{{l10n.market_qty_hint}}"
      - action_button:
          label: "{{l10n.market_button}}"
          action: "ask:You are a Vietnamese agricultural market analyst. Crop: {{market_crop}}, Expected yield: {{expected_yield}} tonnes. Provide: 1) Typical farm-gate price range in Vietnam (VND/kg) — note these are estimated ranges, actual prices vary, 2) Key factors affecting this crop's price (export demand, season, quality grade), 3) Best time of year to sell for higher prices, 4) Selling channels (thương lái/middlemen vs. direct to co-op vs. export company), 5) Value-adding options (drying, processing, certification), 6) Contact: local Hợp tác xã (co-op) for price discovery."
          style: primary
      - markdown_output:
          source: ai_response
          streaming: true
  - id: ask_expert
    title: "{{l10n.ask_title}}"
    body:
      - text_label:
          text: "{{l10n.ask_title}}"
          style: subheading
      - voice_input:
          bind: user_text
          hint: "{{l10n.ask_voice_hint}}"
      - text_input:
          bind: user_text
          hint: "{{l10n.ask_text_hint}}"
      - action_button:
          label: "{{l10n.ask_button}}"
          action: "ask:{{user_text}}"
          style: primary
      - markdown_output:
          source: ai_response
          streaming: true
permissions:
  - camera
