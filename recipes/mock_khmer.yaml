model:
  model_id: "gemma-4-e2b-it"
  backend: "cpu"
  system_prompt: |
    You are Kasikam Chhlat (Smart Farming / កសិកម្មឆ្លាត), an AI agricultural assistant for Cambodian smallholder farmers. You specialize in Cambodian farming conditions, especially rice cultivation, and help with crop disease diagnosis, fertilizer recommendations, and planting guidance.

    Your knowledge includes:
    - Cambodian rice varieties: IR50404, Sen Kra Ob, Phkar Rumduol, Neang Malis, Jasmine varieties
    - Cambodian rice seasons: Preng (wet season, May-Nov) and Vosa (dry season, Dec-Apr)
    - Common rice diseases in Cambodia: blast (ជំងឺអណ្តូង), sheath blight, bacterial blight, neck rot
    - Cambodian crop challenges: irregular rainfall, flooding, poor soil fertility, limited credit access
    - Key extension service: MAFF (Ministry of Agriculture, Forestry and Fisheries)
    - Low-cost, practical solutions suited to smallholders with <2 hectares
    - Other important crops: cassava (មាន), maize (ពោត), sugarcane, vegetables

    Always:
    - Respond in Khmer (km) when the user writes in Khmer
    - Give simple, practical advice suited to smallholders with limited resources
    - Include timing specific to Cambodian seasons
    - Mention MAFF or local agricultural offices for serious problems

    Never:
    - Recommend banned or restricted pesticides
    - Give advice that requires significant capital investment without lower-cost alternatives
safety:
  blocked_keywords:
    - harmful
  disclaimer: "This tool provides general farming guidance and does not replace advice from local agricultural extension officers."
setup:
  intro_page:
    accept_label: "យល់ហើយ — ចាប់ផ្តើម"
    disclaimer: "កសិកម្មឆ្លាតផ្តល់ការណែនាំដំណាំទូទៅ។ សម្រាប់ជំងឺដំណាំធ្ងន់ធ្ងរ សូមទំនាក់ទំនងមន្ត្រីជំនាញនៃក្រសួងកសិកម្ម។"
    author:
      name: "Cambodia Rural Dev"
      organisation: "Cambodia Rural Dev"
      verified: true
    links:
      - label: "Ministry of Agriculture Cambodia (MAFF)"
        url: "https://www.maff.gov.kh"
      - label: "CGIAR Rice Knowledge Bank"
        url: "https://www.knowledgebank.irri.org"
screen_catalog:
  - id: home
    title: "ទំព័រដើម"
    icon: "\U0001F3E0"
  - id: diagnose
    title: "រោគ"
    icon: "\U0001F4F8"
  - id: rice_guide
    title: "ស្រូវ"
    icon: "\U0001F33E"
  - id: fertilizer
    title: "ជី"
    icon: "\U0001F9EA"
  - id: ask_expert
    title: "សួរ"
    icon: "\U0001F4AC"
variables:
  user_text: { type: string, default: "" }
  ai_response: { type: string, default: "" }
  photo_path: { type: string, default: "" }
  rice_stage: { type: string, default: "" }
  field_area: { type: string, default: "" }
  rice_variety: { type: string, default: "" }
  fert_crop: { type: string, default: "" }
  fert_soil: { type: string, default: "" }
  fert_stage: { type: string, default: "" }
screens:
  - id: home
    title: ""
    body:
      - text_label:
          text: "{{l10n.home_heading}}"
          style: subheading
      - macro_grid:
          columns: 2
          buttons:
            - label: "{{l10n.grid_diagnose}}"
              icon: "\U0001F4F8"
              action: "go:diagnose"
            - label: "{{l10n.grid_rice}}"
              icon: "\U0001F33E"
              action: "go:rice_guide"
            - label: "{{l10n.grid_fertilizer}}"
              icon: "\U0001F9EA"
              action: "go:fertilizer"
            - label: "{{l10n.grid_ask}}"
              icon: "\U0001F4AC"
              action: "go:ask_expert"
  - id: diagnose
    title: "{{l10n.diagnose_title}}"
    body:
      - text_label:
          text: "{{l10n.diagnose_heading}}"
          style: subheading
      - camera_input:
          bind: photo_path
      - voice_input:
          bind: user_text
          hint: "{{l10n.diagnose_voice_hint}}"
      - text_input:
          bind: user_text
          hint: "{{l10n.diagnose_text_hint}}"
      - action_button:
          label: "{{l10n.diagnose_button}}"
          action: "vision_ask:You are an agricultural pathologist specializing in Cambodian crops. Analyze this photo. Identify: 1) Crop type visible, 2) Disease or pest name (provide both local/Khmer name if possible and scientific name), 3) Severity, 4) Treatment using pesticides/fungicides available in Cambodia, 5) Prevention steps, 6) Whether to contact local MAFF office. Farmer's additional notes: {{user_text}}"
          style: primary
          visible_if: "photo_path"
      - action_button:
          label: "{{l10n.diagnose_button}}"
          action: "ask:You are an agricultural pathologist for Cambodian crops. Based on the description, diagnose the most likely disease or pest. Provide: 1) Most likely disease/pest name (in Khmer and English if possible), 2) Severity, 3) Treatment with products available in Cambodia, 4) Prevention, 5) When to contact MAFF. Description: {{user_text}}"
          style: primary
          hidden_if: "photo_path"
      - markdown_output:
          source: ai_response
          streaming: true
  - id: rice_guide
    title: "{{l10n.rice_title}}"
    body:
      - text_label:
          text: "{{l10n.rice_heading}}"
          style: subheading
      - text_input:
          bind: rice_stage
          hint: "{{l10n.rice_stage_hint}}"
          input_type: dropdown
          options:
            - "ដំណាក់រៀបព្រៃ (Land preparation)"
            - "ដំណំ (Seedling / Germination)"
            - "ជ្រូកផ្អើ (Tillering)"
            - "ដំណាក់ចាក់ (Stem elongation)"
            - "ដំណាក់ប្រណំ (Panicle initiation)"
            - "ផ្ការ (Flowering / Heading)"
            - "ទុំ (Grain filling)"
            - "ច្រូតកាត់ (Harvest)"
      - text_input:
          bind: field_area
          hint: "{{l10n.rice_area_hint}}"
      - text_input:
          bind: rice_variety
          hint: "{{l10n.rice_variety_hint}}"
          input_type: dropdown
          options:
            - "IR50404"
            - "Sen Kra Ob"
            - "Phkar Rumduol"
            - "Neang Malis 3"
            - "CAR11 (Jasmine)"
            - "ORY01 (Phkar Rumduol Improved)"
            - "ពូជមិនស្គាល់ (Unknown variety)"
      - action_button:
          label: "{{l10n.rice_button}}"
          action: "ask:You are a rice cultivation advisor for Cambodia. Rice growth stage: {{rice_stage}}, Field area: {{field_area}} hectares, Rice variety: {{rice_variety}}. Provide practical guidance for this stage: 1) Key tasks to do now (water management, fertilizer, pest monitoring), 2) Warning signs to watch for this stage, 3) Upcoming next stage preparation, 4) Common mistakes to avoid at this stage, 5) Expected timeline to next stage. Tailor advice to smallholder conditions in Cambodia."
          style: primary
      - markdown_output:
          source: ai_response
          streaming: true
  - id: fertilizer
    title: "{{l10n.fertilizer_title}}"
    body:
      - text_label:
          text: "{{l10n.fertilizer_title}}"
          style: subheading
      - text_input:
          bind: fert_crop
          hint: "{{l10n.fertilizer_crop_hint}}"
          input_type: dropdown
          options:
            - "ស្រូវ (Rice)"
            - "ពោត (Maize)"
            - "មាន (Cassava)"
            - "អំពៅ (Sugarcane)"
            - "ត្រប់ (Cucumber)"
            - "ត្រសក់ (Bitter melon)"
            - "ប្រ (Cabbage)"
            - "ដំណាំបន្លែ (Vegetables)"
      - text_input:
          bind: fert_soil
          hint: "{{l10n.fertilizer_soil_hint}}"
          input_type: dropdown
          options:
            - "ដីខ្មៅ (Dark clay)"
            - "ដីខ្សាច់ (Sandy)"
            - "ដីក្រហម (Red laterite)"
            - "ដីលាយ (Mixed/Loam)"
            - "ដីបាក (Flooded paddy soil)"
      - text_input:
          bind: fert_stage
          hint: "{{l10n.fertilizer_stage_hint}}"
          input_type: dropdown
          options:
            - "ដំណំ (Seedling)"
            - "ការលូតលាស់ (Vegetative growth)"
            - "ដំណាក់ផ្ការ (Flowering)"
            - "ដំណាក់ទុំ (Fruiting/Grain filling)"
      - action_button:
          label: "{{l10n.fertilizer_button}}"
          action: "ask:You are a fertilizer advisor for Cambodian smallholder farmers. Crop: {{fert_crop}}, Soil type: {{fert_soil}}, Growth stage: {{fert_stage}}. Provide: 1) Recommended NPK fertilizer ratio for this crop and stage, 2) Application rate per hectare (kg), 3) Application method (broadcast/side-dress/foliar), 4) Locally available fertilizer brands in Cambodia that match, 5) Organic alternatives using locally available materials (rice straw compost, cow dung), 6) Cost estimate in USD/hectare (rough), 7) Warning signs of over-fertilization for this crop."
          style: primary
      - markdown_output:
          source: ai_response
          streaming: true
  - id: ask_expert
    title: "{{l10n.ask_title}}"
    body:
      - text_label:
          text: "{{l10n.ask_title}}"
          style: subheading
      - voice_input:
          bind: user_text
          hint: "{{l10n.ask_voice_hint}}"
      - text_input:
          bind: user_text
          hint: "{{l10n.ask_text_hint}}"
      - action_button:
          label: "{{l10n.ask_button}}"
          action: "ask:{{user_text}}"
          style: primary
      - markdown_output:
          source: ai_response
          streaming: true
permissions:
  - camera
