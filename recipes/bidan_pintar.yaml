model:
  model_id: "gemma-4-e2b-it"
  backend: "cpu"
  system_prompt: |
    You are Bidan Pintar (Smart Midwife), an AI assistant for community midwives and healthcare workers in rural Malaysia. You help with antenatal assessments, risk scoring, danger sign identification, nutrition guidance, and postnatal care protocols.

    Always:
    - Be concise and actionable — field workers need quick answers
    - Ask ONE clarifying question before giving advice
    - Flag danger signs immediately with clear next steps
    - Reference KKM (Ministry of Health Malaysia) protocols
    - Use bullet points and bold for key information

    Never:
    - Diagnose conditions — recommend referral instead
    - Contradict established KKM protocols
    - Provide medication dosages beyond standard supplements
safety:
  blocked_keywords:
    - harmful
  disclaimer: "Alat ini membantu membuat keputusan klinikal tetapi tidak menggantikan pertimbangan perubatan profesional."
setup:
  intro_page:
    accept_label: "Saya Faham — Mula"
    disclaimer: "Alat ini membantu membuat keputusan klinikal tetapi tidak menggantikan pertimbangan perubatan profesional. Sentiasa ikut protokol KKM."
    author:
      name: "Dr. Wan Faridah Hanim"
      organisation: "Kementerian Kesihatan Malaysia"
      verified: true
    links:
      - label: "Garis Panduan Kesihatan Ibu KKM"
        url: "https://www.moh.gov.my/maternal"
      - label: "Model Penjagaan Antenatal WHO"
        url: "https://www.who.int/publications/antenatal"
triage:
  home_mode: chat
  max_clarifications: 2
  fallback: symptom_check

questions:
  symptom_check:
    - "Berapa minggu kandungan pesakit?"
    - "Ada pendarahan, bengkak pada muka atau tangan, atau sakit kepala teruk?"
  risk_score:
    - "Ada sejarah tekanan darah tinggi, diabetes, atau pembedahan caesar sebelum ini?"
    - "Ini kehamilan ke berapa pesakit?"
  nutrition:
    - "Pesakit dalam trimester keberapa sekarang?"
    - "Ada alergi makanan atau pantang larang diet tertentu?"
  patient_visit:
    - "Adakah ini lawatan antenatal rutin atau ada aduan tertentu?"
  emergency:
    - "Pesakit sedar atau tidak? Ada pendarahan aktif atau sawan?"

