screens:
  - id: home
    title: ""
    body:
      - text_label:
          text: "{{l10n.home_heading}}"
          style: subheading
      - macro_grid:
          columns: 2
          buttons:
            - label: "{{l10n.grid_symptoms}}"
              icon: "\U0001FA7A"
              action: "go:symptoms"
            - label: "{{l10n.grid_first_aid}}"
              icon: "\U0001F691"
              action: "go:first_aid"
            - label: "{{l10n.grid_child_health}}"
              icon: "\U0001F476"
              action: "go:child_health"
            - label: "{{l10n.grid_emergency}}"
              icon: "\U0001F6A8"
              action: "go:emergency"
  - id: symptoms
    title: "{{l10n.symptoms_title}}"
    body:
      - text_label:
          text: "{{l10n.symptoms_heading}}"
          style: subheading
      - voice_input:
          bind: user_text
          hint: "{{l10n.symptoms_voice_hint}}"
      - text_input:
          bind: user_text
          hint: "{{l10n.symptoms_text_hint}}"
      - action_button:
          label: "{{l10n.symptoms_button}}"
          action: "ask:You are a community health triage assistant for rural Myanmar. Assess the following symptoms and determine urgency. Check for danger signs requiring IMMEDIATE hospital referral: chest pain, difficulty breathing, unconsciousness, convulsions, heavy bleeding, signs of stroke (sudden one-sided weakness/facial droop/speech difficulty), suspected poisoning or snake bite. Classify as: EMERGENCY (go to hospital now), URGENT (see health worker today), or HOME CARE (manage with guidance). For home care, give specific steps. Symptoms: {{user_text}}"
          style: primary
      - markdown_output:
          source: ai_response
          streaming: true
  - id: first_aid
    title: "{{l10n.first_aid_title}}"
    body:
      - text_label:
          text: "{{l10n.first_aid_heading}}"
          style: subheading
      - text_input:
          bind: first_aid_condition
          hint: "{{l10n.first_aid_condition_hint}}"
          input_type: dropdown
          options:
            - "Snake bite (မြွေကိုက်)"
            - "Burns (မီးလောင်)"
            - "Choking (လည်ချောင်းပိတ်)"
            - "Unconscious / Fainting (သတိမဲ့)"
            - "Fracture / Broken bone (အရိုးကျိုး)"
            - "Wound / Bleeding (ဒဏ်ရာ / သွေးထွက်)"
            - "Diarrhoea / Dehydration (ဝမ်းလျှောဝမ်းပျက်)"
            - "Fever (ဖျားနာ)"
            - "Drowning (ရေနစ်)"
            - "Eye injury (မျက်စိထိခိုက်)"
      - action_button:
          label: "{{l10n.first_aid_button}}"
          action: "ask:You are a first aid guide for rural Myanmar community health workers with basic supplies only. Condition: {{first_aid_condition}}. Provide: 1) Immediate steps to take right now (numbered, simple), 2) What NOT to do (common harmful traditional practices to avoid), 3) Warning signs that require urgent hospital referral, 4) How to transport the patient safely if referral needed, 5) Follow-up care if home management is appropriate. Use simple clear language."
          style: primary
      - markdown_output:
          source: ai_response
          streaming: true
  - id: child_health
    title: "{{l10n.child_title}}"
    body:
      - text_label:
          text: "{{l10n.child_heading}}"
          style: subheading
      - slider:
          bind: child_age_months
          min: 0
          max: 60
          step: 1
          label: "{{l10n.child_age_hint}}"
          left_label: "{{l10n.child_age_left}}"
          right_label: "{{l10n.child_age_right}}"
          show_value: true
      - text_input:
          bind: child_symptom
          hint: "{{l10n.child_symptom_hint}}"
      - action_button:
          label: "{{l10n.child_button}}"
          action: "ask:You are a child health triage worker using WHO IMCI guidelines for Myanmar. Child age: {{child_age_months}} months. Problem reported: {{child_symptom}}. Assess using IMCI: 1) Check for GENERAL DANGER SIGNS (unable to drink/breastfeed, vomits everything, convulsions, very sleepy/lethargic, chest in-drawing, stridor) — if any present: URGENT hospital referral; 2) Assess for the main symptom (fever=malaria/dengue assessment, diarrhoea=dehydration, cough=ARI, ear problem); 3) Check nutritional status if applicable; 4) Classify severity (Severe/Moderate/Mild); 5) Advise: hospital now / health center today / home care with instructions."
          style: primary
      - markdown_output:
          source: ai_response
          streaming: true
  - id: emergency
    title: "{{l10n.emergency_title}}"
    body:
      - text_label:
          text: "{{l10n.emergency_title}}"
          style: subheading
      - text_label:
          text: "{{l10n.emergency_subtext}}"
          style: body
      - action_button:
          label: "{{l10n.emergency_ambulance}}"
          action: "tel:192"
          style: danger
      - action_button:
          label: "{{l10n.emergency_call}}"
          action: "tel:+9502058888"
          style: danger
      - action_button:
          label: "{{l10n.emergency_sms}}"
          action: "sms:+9502058888:Medical emergency. Patient needs urgent assistance. Location: {{user_location}}."
          style: primary
      - action_button:
          label: "{{l10n.emergency_find_hospital}}"
          action: "geolocate"
          style: secondary
      - geo_display:
          data: "hospitals"
          limit: 5
          show_distance: true
permissions:
  - location
