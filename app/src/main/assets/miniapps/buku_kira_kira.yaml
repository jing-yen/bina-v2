id: buku_kira_kira
name: Buku Kira-Kira
description: "Smart bookkeeping for sari-sari stores. Track sales, costs, and daily profit."
icon: "📒"
version: "0.9.0"
category: Business

cover_image: ""
featured: false
emergency: false
dialect: "Tagalog"
tags:
  - bookkeeping
  - sari-sari
  - small-business
  - philippines

author:
  name: Maria Lopez
  organisation: Community Author
  verified: false

model:
  model_id: gemma-4-e2b-it
  backend: cpu
  system_prompt: |
    You are Buku Kira-Kira, a friendly bookkeeping helper for sari-sari
    store owners and small Filipino businesses. Use simple Tagalog or
    Taglish. Help users understand cash flow, margins, and inventory.
    Never give regulated tax advice; suggest consulting a BIR officer
    for filing questions.
  sampler:
    temperature: 0.3
    top_k: 40
    top_p: 0.95
    max_tokens: 384

theme:
  primary: "#0EA5E9"
  secondary: "#34D399"
  text_size: standard

localisation:
  default_language: tl
  labels:
    en:
      chat_placeholder: "Ask Buku Kira-Kira..."
    tl:
      chat_placeholder: "Magtanong sa Buku Kira-Kira..."

variables:
  user_text:    { type: string, default: "" }
  sales:        { type: number, default: "0" }
  costs:        { type: number, default: "0" }
  profit:       { type: number, default: "0" }
  ai_response:  { type: string, default: "" }

screens:
  - id: home
    title: Buku Kira-Kira
    body:
      - text_label:
          text: "Anong gusto mong gawin ngayon?"
          style: subheading

      - macro_grid:
          columns: 2
          buttons:
            - { label: "Daily Profit", action: "go:profit" }
            - { label: "Inventory Tips", action: "ask:Paano ko ayusin ang stock ng tindahan ko?" }
            - { label: "Pricing Help", action: "ask:Magkano dapat ang dagdag presyo para may tubo?" }
            - { label: "Cash Flow", action: "ask:Paano ko bantayan ang cash flow ng tindahan?" }

      - text_input:
          bind: user_text
          hint: "O magtanong ng kahit ano..."

      - action_button:
          label: "Tanungin"
          action: "ask:{{user_text}}"
          style: primary

      - markdown_output:
          source: ai_response
          empty_text: "Lalabas dito ang sagot..."
          streaming: true

  - id: profit
    title: Daily Profit
    body:
      - text_label:
          text: "Ilagay ang sales at gastos para sa araw na ito"
          style: subheading

      - text_input:
          bind: sales
          hint: "hal. 1500"
          label: "Total Sales (PHP)"
          input_type: number

      - text_input:
          bind: costs
          hint: "hal. 900"
          label: "Total Gastos (PHP)"
          input_type: number

      - action_button:
          label: "Compute Profit"
          action: "formula:profit"
          style: primary

      - metric_card:
          source: profit
          label: "Net Profit"
          prefix: "PHP "
          format: decimal_2

      - action_button:
          label: "Tanungin si Buku tungkol sa profit"
          action: "ask:Kumita ako ng PHP{{sales}} at gumastos ng PHP{{costs}}. Net ko ay PHP{{profit}}. Ano payo mo?"
          style: secondary

formulas:
  profit:
    expression: "{{sales}} - {{costs}}"
    output: profit

safety:
  blocked_keywords: []
  escalation_message: ""
  disclaimer: "AI advice lang ito. Para sa BIR/tax, kumonsulta sa propesyonal."

permissions: []

features:
  - { id: camera_scanner,  name: "Receipt Scanner",  icon: camera,        recommended: true,  size_kb: 0.4, requires: [permission:camera],     description: "Snap receipts and extract amounts" }
  - { id: voice_assistant, name: "Voice Assistant",  icon: mic,           recommended: true,  size_kb: 0.3, requires: [permission:microphone], description: "Speak entries instead of typing" }
  - { id: offline_storage, name: "Offline Storage",  icon: storage,       recommended: true,  size_kb: 0.3, requires: [],                       description: "Keeps daily ledger between sessions" }
  - { id: smart_notif,     name: "Smart Notifications", icon: notifications, recommended: false, size_kb: 0.1, requires: [service:smart_notifications], description: "Daily-close reminders" }
