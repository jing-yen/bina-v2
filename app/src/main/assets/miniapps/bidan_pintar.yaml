    accept_label: "Saya Faham — Mula"
    disclaimer: "Alat ini membantu membuat keputusan klinikal tetapi tidak menggantikan pertimbangan perubatan profesional. Sentiasa ikut protokol KKM."
    author:
      name: "Dr. Wan Faridah Hanim"
      organisation: "Kementerian Kesihatan Malaysia"
      verified: true
    links:
      - label: "Garis Panduan Kesihatan Ibu KKM"
