id: farm_buddy
name: Farm Buddy
description: "Diagnose crops, calculate profit, find nearby agro shops."
icon: "🌾"
version: "1.0.0"
category: Agriculture

cover_image: ""
featured: true
emergency: false
dialect: "Bahasa Malaysia"
tags:
  - farming
  - crops
  - profit
  - southeast-asia

author:
  name: Universiti Putra Malaysia
  organisation: AgriTech Faculty
  verified: true

model:
  model_id: gemma-4-e2b-it
  backend: cpu
  system_prompt: |
    You are Farm Buddy (Pakar Tani), an agricultural education assistant
    for Southeast Asian smallholder farmers.
    Give simple, practical, safe guidance.
    Do not claim certainty in diagnoses.
    Ask clarifying questions about crop type, symptoms, weather.
    If the issue seems severe, advise contacting a local agriculture officer.
    Never recommend restricted or dangerous chemicals.
  sampler:
    temperature: 0.3
    top_k: 40
    top_p: 0.95
    max_tokens: 512

theme:
  primary: "#2E7D32"
  secondary: "#A5D6A7"
  text_size: standard

localisation:
  default_language: ms
  labels:
    en:
      chat_placeholder: "Ask Farm Buddy..."
    ms:
      chat_placeholder: "Tanya Pakar Tani..."

variables:
  user_text:    { type: string, default: "" }
  photo_path:   { type: string, default: "" }
  ai_response:  { type: string, default: "" }
  revenue:      { type: number, default: "0" }
  costs:        { type: number, default: "0" }
  tax_rate:     { type: number, default: "5" }
  profit:       { type: number, default: "0" }

screens:
  - id: home
    title: Farm Buddy
    body:
      - text_label:
          text: "What would you like to do?"
          style: subheading

      - macro_grid:
          columns: 2
          buttons:
            - { label: "Diagnose Leaf", action: "go:diagnose", icon: "📷" }
            - { label: "Profit Calculator", action: "go:profit", icon: "🧮" }
            - { label: "Fertiliser Guide", action: "ask:What fertiliser should I use for rice?", icon: "🌱" }
            - { label: "Nearest Agro Shop", action: "go:nearby", icon: "📍" }

      - text_input:
          bind: user_text
          hint: "Or ask anything..."

      - action_button:
          label: "Ask Farm Buddy"
          action: "ask:{{user_text}}"

      - markdown_output:
          source: ai_response
          empty_text: "Responses will appear here..."

  - id: diagnose
    title: Leaf Diagnosis
    body:
      - text_label:
          text: "Take a photo of the affected leaf for AI diagnosis."
          style: body

      - camera_input:
          bind: photo_path
          label: "Take Photo"
          preview: true

      - text_input:
          bind: user_text
          hint: "Describe symptoms (optional)"
          label: "Additional info"

      - action_button:
          label: "Diagnose"
          action: "vision_ask:Diagnose this crop leaf. Describe the disease, likely cause, and treatment. {{user_text}}"
          style: primary

      - markdown_output:
          source: ai_response
          streaming: true

  - id: profit
    title: Profit Calculator
    body:
      - text_label:
          text: "Calculate your farming profit"
          style: subheading

      - text_input:
          bind: revenue
          hint: "e.g., 5000"
          label: "Total Revenue (RM)"
          input_type: number

      - text_input:
          bind: costs
          hint: "e.g., 2000"
          label: "Total Costs (RM)"
          input_type: number

      - slider:
          bind: tax_rate
          min: 0
          max: 30
          step: 1
          label: "Estimated Tax"
          left_label: "0%"
          right_label: "30%"

      - action_button:
          label: "Calculate"
          action: "formula:profit"
          style: primary

      - metric_card:
          source: profit
          label: "Net Profit"
          prefix: "RM "
          format: decimal_2

      - action_button:
          label: "Get AI advice on my profit"
          action: "ask:I made RM{{revenue}} with RM{{costs}} costs and {{tax_rate}}% tax. Net: RM{{profit}}. Advice?"
          style: secondary

  - id: nearby
    title: Nearest Agro Shop
    body:
      - text_label:
          text: "Find fertiliser and supply shops near you"
          style: subheading

      - action_button:
          label: "Get My Location"
          action: "geolocate"
          style: primary

      - geo_display:
          data: agro_shops
          limit: 5
          show_distance: true
          empty_text: "Tap above to find nearby shops"

      - action_button:
          label: "Ask for directions"
          action: "ask:How do I get to the nearest agro shop?"
          style: secondary

formulas:
  profit:
    expression: "({{revenue}} - {{costs}}) * (1 - {{tax_rate}} / 100)"
    output: profit

data:
  agro_shops:
    type: points
    items:
      - { name: "Kedai Baja Pak Ali", lat: 3.139, lng: 101.687, info: "Open 8am-5pm" }
      - { name: "AgriMart Seremban", lat: 2.725, lng: 101.938, info: "Fertiliser specialist" }
      - { name: "Tani Supply Melaka", lat: 2.189, lng: 102.250, info: "Seeds and tools" }
      - { name: "Koperasi Tani Johor", lat: 1.485, lng: 103.761, info: "Wholesale pricing" }

safety:
  blocked_keywords:
    - mix pesticide
    - poison
    - kill pest with fuel
    - dangerous spray
    - drink chemical
  escalation_message: "This may be dangerous. Please contact your local agriculture officer."
  disclaimer: "AI-generated guidance. Not a professional consultation."

setup:
  intro_page:
    accept_label: "I Understand & Accept"
    disclaimer: "Farm Buddy provides AI-generated agricultural guidance for educational purposes only. It does not replace professional agronomist advice. Always verify recommendations with your local agriculture department before applying treatments."
    cover_photo: false
    author:
      name: Universiti Putra Malaysia
      organisation: AgriTech Faculty
      verified: true
    links:
      - { label: "UPM AgriTech Website", url: "https://agriculture.upm.edu.my" }
      - { label: "Malaysian DOA Guidelines", url: "https://www.doa.gov.my" }

triage:
  home_mode: grid
  max_clarifications: 2
  fallback: show_all

screen_catalog:
  - id: diagnose
    title: Leaf Diagnosis
    template: vision_analysis
    icon: "🔬"
    description: "Take a photo of a diseased or damaged crop leaf to get an AI-powered diagnosis with treatment recommendations."
    accepted_inputs: [photo, text]
    prefill_hints: {}
  - id: profit
    title: Profit Calculator
    template: calculator
    icon: "💰"
    description: "Calculate farming profit after costs and tax. Get AI advice on improving margins."
    accepted_inputs: [number]
    prefill_hints: {}
  - id: nearby
    title: Nearest Agro Shop
    template: geo_lookup
    icon: "📍"
    description: "Find fertiliser and agricultural supply shops near your location."
    accepted_inputs: [location]
    prefill_hints: {}

knowledge:
  always_loaded: |
    Common Southeast Asian crop diseases:
    - Rice blast (Pyricularia oryzae): grey-green spots on leaves, spread in humid conditions. Treat with tricyclazole fungicide.
    - Bacterial leaf blight (Xanthomonas oryzae): yellow-white lesions along leaf veins. Use resistant varieties, avoid excess nitrogen.
    - Tungro virus: yellow-orange discolouration from base. Control green leafhopper vector. No direct cure.
    - Brown planthopper: honeydew deposits, hopper burn. Use resistant varieties, avoid excessive insecticides.
    Common crops: rice (padi), oil palm (kelapa sawit), rubber (getah), cocoa, durian, pepper.
  chunks: 0

questions:
  diagnose:
    - "What crop are you growing?"
    - "Can you describe the symptoms you're seeing?"
  profit:
    - "What crop did you harvest?"
    - "How many hectares?"

permissions:
  - camera
  - location

features:
  - { id: camera_scanner,  name: "Camera Scanner",   icon: camera,        recommended: true,  size_kb: 0.4, requires: [permission:camera],            description: "Allows the AI to see crop diseases" }
  - { id: voice_assistant, name: "Voice Assistant",  icon: mic,           recommended: true,  size_kb: 0.3, requires: [permission:microphone],        description: "Allows you to speak your questions" }
  - { id: gps_tracker,     name: "GPS Tracker",      icon: gps_fixed,     recommended: true,  size_kb: 0.2, requires: [permission:location],          description: "Saves the location of inspected fields" }
  - { id: offline_storage, name: "Offline Storage",  icon: storage,       recommended: true,  size_kb: 0.3, requires: [],                              description: "Stores history for later review" }
  - { id: sms_dispatcher,  name: "SMS Dispatcher",   icon: sms,           recommended: false, size_kb: 0.2, requires: [service:sms_dispatch],          description: "Texts the nearest agro shop" }
  - { id: p2p_sharing,     name: "P2P Recipe Share", icon: share,         recommended: false, size_kb: 0.2, requires: [service:p2p],                   description: "Shares recipe with neighbours" }
  - { id: smart_notif,     name: "Smart Notifications", icon: notifications, recommended: false, size_kb: 0.1, requires: [service:smart_notifications], description: "Alerts for important updates" }
