model:
  model_id: "gemma-4-e2b-it"
  backend: "cpu"
  system_prompt: |
    You are Pakar Sawit (Palm Oil Expert), an AI assistant for smallholder palm oil farmers under FELDA (Federal Land Development Authority) Malaysia. You help with palm disease diagnosis, fertilizer scheduling, harvest quality, and replanting decisions.

    Your knowledge includes:
    - Ganoderma Basal Stem Rot (BSR) — the #1 killer of oil palms, must always be treated as urgent
    - Rhinoceros beetle (Oryctes rhinoceros) damage recognition and control
    - Bunch rot, crown disease, frond diseases, and nutrient deficiencies (N, P, K, Mg, B)
    - FELDA and MPOB recommended practices and subsidy schemes
    - Fertilizer schedules by palm age: N-P-K-Mg-B ratios, application frequency, quantities per palm
    - Harvest criteria: Loose Fruit Count (LFC) method, optimal harvesting cycle (10-14 days)
    - FELDA settler obligations and record-keeping requirements
    - Replanting economics and FELDA replanting grant eligibility

    Always:
    - Be concise and actionable — settlers need quick field decisions
    - Flag Ganoderma BSR as HIGH PRIORITY — advise FELDA officer contact immediately
    - Reference FELDA/MPOB approved treatments and locally available products
    - Include timing and cost estimates in RM where possible

    Never:
    - Recommend banned pesticides (paraquat, endosulfan, etc.)
    - Minimize Ganoderma — always escalate
    - Give legal or financial advice beyond general FELDA scheme awareness
safety:
  blocked_keywords:
    - paraquat
    - endosulfan
    - racun terlarang
  escalation_message: "Pakar Sawit tidak boleh mengesyorkan racun terlarang. Sila hubungi pegawai FELDA atau MPOB kawasan anda."
  disclaimer: "Alat bantuan diagnosis sawit. Untuk penyakit kritikal terutama Ganoderma, sila hubungi pegawai FELDA kawasan anda."
setup:
  intro_page:
    accept_label: "Saya Faham — Mula"
    disclaimer: "Pakar Sawit membantu mengenal pasti penyakit sawit dan merancang jadual baja. Untuk jangkitan Ganoderma atau keputusan pelaburan besar, sila rujuk pegawai FELDA anda."
    author:
      name: "FELDA Malaysia"
      organisation: "FELDA Malaysia"
      verified: true
    links:
      - label: "Portal FELDA"
        url: "https://www.felda.gov.my"
      - label: "Portal MPOB"
        url: "https://www.mpob.gov.my"
screen_catalog:
  - id: home
    title: "Home"
    icon: "\U0001F3E0"
  - id: diagnose
    title: "Diagnos"
    icon: "\U0001F4F8"
  - id: fertilizer
    title: "Baja"
    icon: "\U0001F9EA"
  - id: harvest
    title: "Tuai"
    icon: "\U0001F4C5"
  - id: ask_expert
    title: "Tanya"
    icon: "\U0001F4AC"
variables:
  user_text: { type: string, default: "" }
  ai_response: { type: string, default: "" }
  photo_path: { type: string, default: "" }
  palm_age: { type: string, default: "" }
  soil_type: { type: string, default: "" }
  harvest_step: { type: number, default: "0" }
  last_diagnosis: { type: string, default: "" }
screens:
  - id: home
    title: ""
    body:
      - text_label:
          text: "{{l10n.home_heading}}"
          style: subheading
      - macro_grid:
          columns: 2
          buttons:
            - label: "{{l10n.grid_diagnose}}"
              icon: "\U0001F4F8"
              action: "go:diagnose"
            - label: "{{l10n.grid_fertilizer}}"
              icon: "\U0001F9EA"
              action: "go:fertilizer"
            - label: "{{l10n.grid_harvest}}"
              icon: "\U0001F4C5"
              action: "go:harvest"
            - label: "{{l10n.grid_ask}}"
              icon: "\U0001F4AC"
              action: "go:ask_expert"
  - id: diagnose
    title: "{{l10n.diagnose_title}}"
    body:
      - text_label:
          text: "{{l10n.diagnose_heading}}"
          style: subheading
      - camera_input:
          bind: photo_path
      - voice_input:
          bind: user_text
          hint: "{{l10n.diagnose_voice_hint}}"
      - text_input:
          bind: user_text
          hint: "{{l10n.diagnose_text_hint}}"
      - action_button:
          label: "{{l10n.diagnose_button}}"
          action: "vision_ask:You are a palm oil pathologist for Malaysian FELDA smallholders. Analyze this photo of an oil palm. Identify: 1) Disease name (Ganoderma BSR, rhinoceros beetle, bunch rot, frond disease, nutrient deficiency), 2) Severity (mild/moderate/severe/critical), 3) Affected part, 4) Immediate action — if Ganoderma: flag as HIGH PRIORITY contact FELDA officer now, 5) MPOB/FELDA approved treatment with product names and dosage, 6) Follow-up timeline. Farmer notes: {{user_text}}"
          style: primary
          visible_if: "photo_path"
      - action_button:
          label: "{{l10n.diagnose_button}}"
          action: "ask:You are a palm oil pathologist for FELDA Malaysia. Based on the farmer's description, diagnose the most likely disease. Give: 1) Most probable diagnosis, 2) Severity, 3) Immediate action (if Ganoderma suspected — flag HIGH PRIORITY, advise FELDA officer contact), 4) MPOB-approved treatment with product names, 5) Follow-up timeline. Description: {{user_text}}"
          style: primary
          hidden_if: "photo_path"
      - markdown_output:
          source: ai_response
          streaming: true
  - id: fertilizer
    title: "{{l10n.fertilizer_title}}"
    body:
      - text_label:
          text: "{{l10n.fertilizer_heading}}"
          style: subheading
      - text_input:
          bind: palm_age
          hint: "{{l10n.fertilizer_age_hint}}"
          input_type: dropdown
          options:
            - "1-3 tahun (Immature / Belum matang)"
            - "4-7 tahun (Young mature / Matang muda)"
            - "8-15 tahun (Prime / Puncak)"
            - "16-25 tahun (Aging / Menua)"
            - "25+ tahun (Replant / Tanaman semula)"
      - text_input:
          bind: soil_type
          hint: "{{l10n.fertilizer_soil_hint}}"
          input_type: dropdown
          options:
            - "Tanah Liat (Clay)"
            - "Tanah Gambut (Peat)"
            - "Tanah Berpasir (Sandy)"
            - "Tanah Aluvial (Alluvial)"
            - "Laterit (Laterite)"
      - action_button:
          label: "{{l10n.fertilizer_button}}"
          action: "ask:Generate a complete FELDA/MPOB-aligned fertilizer schedule for oil palm. Palm age: {{palm_age}}, Soil type: {{soil_type}}. Provide: 1) Fertilizer type (N-P-K-Mg-B) ratio recommended for this age and soil, 2) Number of applications per year, 3) Quantity per palm per round (kg), 4) Best months to apply (avoid heavy rain), 5) Application method (broadcast/pocket), 6) Estimated cost per palm per year (RM), 7) FELDA subsidy options if applicable. Follow MPOB recommended rates."
          style: primary
      - markdown_output:
          source: ai_response
          streaming: true
  - id: harvest
    title: "{{l10n.harvest_title}}"
    body:
      - text_label:
          text: "{{l10n.harvest_heading}}"
          style: subheading
      - checklist_items:
          bind: harvest_step
          items:
            - label: "{{l10n.harvest_step1}}"
              type: text
            - label: "{{l10n.harvest_step2}}"
              type: text
            - label: "{{l10n.harvest_step3}}"
              type: text
            - label: "{{l10n.harvest_step4}}"
              type: text
            - label: "{{l10n.harvest_step5}}"
              type: text
            - label: "{{l10n.harvest_step6}}"
              type: text
      - progress_bar:
          bind: harvest_step
          total: 6
      - action_button:
          label: "{{l10n.harvest_next}}"
          action: "increment:harvest_step"
          style: primary
      - action_button:
          label: "{{l10n.harvest_summary}}"
          action: "ask:Generate a brief palm oil harvest completion report for FELDA records. All 6 harvest steps completed: checked ripeness (5-loose fruit criteria), cut bunch stalks, collected loose fruits, arranged separately, sent to mill within 24 hours, recorded harvest weight. Provide: 1) Harvest quality checklist summary, 2) Tips to improve OER (Oil Extraction Rate) in next harvest, 3) Recommended harvest cycle (days until next harvest), 4) Record-keeping reminder for FELDA claims."
          style: secondary
          visible_if: "harvest_step >= 6"
      - markdown_output:
          source: ai_response
          streaming: true
  - id: ask_expert
    title: "{{l10n.ask_title}}"
    body:
      - text_label:
          text: "{{l10n.ask_title}}"
          style: subheading
      - voice_input:
          bind: user_text
          hint: "{{l10n.ask_voice_hint}}"
      - text_input:
          bind: user_text
          hint: "{{l10n.ask_text_hint}}"
      - action_button:
          label: "{{l10n.ask_button}}"
          action: "ask:{{user_text}}"
          style: primary
      - markdown_output:
          source: ai_response
          streaming: true
permissions:
  - camera
