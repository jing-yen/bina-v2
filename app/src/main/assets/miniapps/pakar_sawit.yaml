  palm_age: { type: string, default: "" }
  soil_type: { type: string, default: "" }
  last_fertilizer: { type: string, default: "" }
  treatment_step: { type: number, default: "0" }
  last_diagnosis: { type: string, default: "" }
screens:
  - id: home
    title: ""
    body:
      - text_label:
          text: "{{l10n.home_heading}}"
          style: subheading
      - macro_grid:
          columns: 2
          buttons:
            - label: "{{l10n.grid_diagnose}}"
              icon: "\U0001F4F8"
              action: "go:diagnose"
            - label: "{{l10n.grid_treatment}}"
              icon: "\U0001F489"
              action: "go:treatment"
            - label: "{{l10n.grid_schedule}}"
              icon: "\U0001F4C5"
              action: "go:schedule"
            - label: "{{l10n.grid_shops}}"
              icon: "\U0001F3EA"
              action: "go:shops"
            - label: "{{l10n.grid_ask}}"
              icon: "\U0001F4AC"
              action: "go:ask_expert"
  - id: diagnose
    title: "{{l10n.diagnose_title}}"
    body:
      - text_label:
          text: "{{l10n.diagnose_title}}"
          style: subheading
      - camera_input:
          bind: photo_path
      - voice_input:
          bind: user_text
          hint: "{{l10n.diagnose_voice_hint}}"
      - text_input:
          bind: user_text
          hint: "{{l10n.diagnose_hint}}"
      - action_button:
          label: "{{l10n.diagnose_button}}"
          action: "vision_ask:You are a palm oil pathologist. Analyze this photo of an oil palm. Identify: 1) Disease name (Ganoderma BSR, Rhinoceros beetle, bunch rot, nutrient deficiency, etc.), 2) Severity (mild/moderate/severe/critical), 3) Affected part (frond/trunk/fruit bunch/root zone), 4) Immediate action required, 5) MPOB-recommended treatment with product names and dosage, 6) Timeline for follow-up. If Ganoderma: ALWAYS flag as HIGH PRIORITY. Additional farmer notes: {{user_text}}"
          style: primary
          visible_if: "photo_path"
      - action_button:
          label: "{{l10n.diagnose_button}}"
          action: "ask:You are a palm oil pathologist. Based on the farmer's description, diagnose the most likely disease. Give: 1) Most probable diagnosis, 2) Severity, 3) Immediate action, 4) Treatment with MPOB-approved products, 5) Follow-up timeline. If symptoms suggest Ganoderma, flag as HIGH PRIORITY. Description: {{user_text}}"
          style: primary
          hidden_if: "photo_path"
      - markdown_output:
          source: ai_response
          streaming: true
  - id: treatment
    title: "{{l10n.treatment_title}}"
    body:
      - text_label:
          text: "{{l10n.treatment_heading}}"
          style: subheading
      - checklist_items:
          bind: treatment_step
          items:
            - label: "{{l10n.treatment_step1}}"
              type: text
            - label: "{{l10n.treatment_step2}}"
              type: text
            - label: "{{l10n.treatment_step3}}"
              type: text
            - label: "{{l10n.treatment_step4}}"
              type: text
            - label: "{{l10n.treatment_step5}}"
              type: text
            - label: "{{l10n.treatment_step6}}"
              type: text
      - progress_bar:
          bind: treatment_step
          total: 6
      - action_button:
          label: "{{l10n.treatment_next}}"
          action: "increment:treatment_step"
          style: primary
      - action_button:
          label: "{{l10n.treatment_summary}}"
          action: "ask:Generate a treatment completion report for my oil palm. Treatment steps completed: Identified affected area, removed infected fronds, applied fungicide at base, installed soil mound, re-inspected after 14 days, recorded results. Provide: 1) Summary of treatment, 2) Effectiveness assessment, 3) Next steps if disease persists, 4) Prevention measures for surrounding palms. Format as a field report for MPOB records."
          style: secondary
          visible_if: "treatment_step >= 6"
      - markdown_output:
          source: ai_response
          streaming: true
  - id: schedule
    title: "{{l10n.schedule_title}}"
    body:
      - text_label:
          text: "{{l10n.schedule_heading}}"
          style: subheading
      - text_input:
          bind: palm_age
          hint: "{{l10n.schedule_age_hint}}"
          input_type: dropdown
          options:
            - "1-3 tahun (Immature)"
            - "4-7 tahun (Young mature)"
            - "8-15 tahun (Prime)"
            - "16-25 tahun (Aging)"
            - "25+ tahun (Replant candidate)"
      - text_input:
          bind: soil_type
          hint: "{{l10n.schedule_soil_hint}}"
          input_type: dropdown
          options:
            - "Tanah Liat (Clay)"
            - "Tanah Berpasir (Sandy)"
            - "Tanah Gambut (Peat)"
            - "Tanah Aluvial (Alluvial)"
            - "Laterit (Laterite)"
      - text_input:
          bind: last_fertilizer
          hint: "{{l10n.schedule_last_hint}}"
      - action_button:
          label: "{{l10n.schedule_button}}"
          action: "ask:Generate a complete annual fertilizer schedule for oil palm. Details — Palm age category: {{palm_age}}, Soil type: {{soil_type}}, Last fertilizer applied: {{last_fertilizer}}. Provide: 1) Fertilizer type and NPK ratio per round, 2) Application frequency (rounds per year), 3) Quantity per palm (kg), 4) Best months to apply (Malaysian weather), 5) Estimated cost per palm per year (RM), 6) Application method (broadcast/pocket/banding). Follow MPOB recommended rates."
          style: primary
      - markdown_output:
          source: ai_response
          streaming: true
  - id: shops
    title: "{{l10n.shops_title}}"
    body:
      - text_label:
          text: "{{l10n.shops_title}}"
          style: subheading
      - text_label:
          text: "{{l10n.shops_subtext}}"
          style: body
      - action_button:
          label: "{{l10n.shops_locate}}"
          action: "geolocate"
          style: secondary
      - geo_display:
          data: "agro_shops"
          limit: 5
          show_distance: true
      - action_button:
          label: "{{l10n.shops_sms_mpob}}"
          action: "sms:+60321816601:Salam, saya pekebun kecil sawit perlukan bantuan. Diagnosis AI: {{last_diagnosis}}. Lokasi: {{user_location}}. — Dihantar dari Pakar Sawit"
          style: primary
      - action_button:
          label: "{{l10n.shops_call_mpob}}"
          action: "tel:+60321816601"
          style: danger
  - id: ask_expert
    title: "{{l10n.ask_title}}"
    body:
      - text_label:
          text: "{{l10n.ask_title}}"
          style: subheading
      - voice_input:
          bind: user_text
          hint: "{{l10n.ask_voice_hint}}"
      - text_input:
          bind: user_text
          hint: "{{l10n.ask_text_hint}}"
      - action_button:
          label: "{{l10n.ask_button}}"
          action: "ask:{{user_text}}"
          style: primary
      - markdown_output:
          source: ai_response
          streaming: true
permissions:
  - camera
  - location
