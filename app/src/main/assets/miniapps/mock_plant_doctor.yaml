variables:
  user_text: { type: string, default: "" }
  ai_response: { type: string, default: "" }
  photo_path: { type: string, default: "" }
  soil_ph: { type: number, default: "6" }
  soil_type: { type: string, default: "" }
  crop_type: { type: string, default: "" }
  soil_drainage: { type: string, default: "false" }
  soil_flooding: { type: string, default: "false" }
  soil_failure: { type: string, default: "false" }
  crop_select: { type: string, default: "" }
  last_result: { type: string, default: "" }
screens:
  - id: home
    title: ""
    body:
      - text_label:
          text: "{{l10n.home_heading}}"
          style: subheading
      - macro_grid:
          columns: 2
          buttons:
            - label: "{{l10n.grid_diagnose}}"
              icon: "\U0001F4F8"
              action: "go:diagnose"
            - label: "{{l10n.grid_soil}}"
              icon: "\U0001F9EA"
              action: "go:soil"
            - label: "{{l10n.grid_crop}}"
              icon: "\U0001F331"
              action: "go:crop_guide"
            - label: "{{l10n.grid_shops}}"
              icon: "\U0001F3EA"
              action: "go:shops"
  - id: diagnose
    title: "{{l10n.diagnose_title}}"
    body:
      - text_label:
          text: "{{l10n.diagnose_title}}"
          style: subheading
      - camera_input:
          bind: photo_path
      - voice_input:
          bind: user_text
          hint: "{{l10n.diagnose_voice_hint}}"
      - text_input:
          bind: user_text
          hint: "{{l10n.diagnose_text_hint}}"
      - action_button:
          label: "{{l10n.diagnose_button}}"
          action: "vision_ask:You are a plant pathologist. Analyze this photo of a crop/plant. Identify: 1) The plant species if visible, 2) The disease or pest affecting it, 3) Severity (mild/moderate/severe), 4) Recommended treatment using locally available products in Southeast Asia, 5) Prevention measures. If the image is unclear, ask for a better photo. Additional context from farmer: {{user_text}}"
          style: primary
          visible_if: "photo_path"
      - action_button:
          label: "{{l10n.diagnose_button}}"
          action: "ask:You are a plant pathologist. Based on the farmer's description, identify the most likely disease or pest. Give: 1) Most probable diagnosis, 2) Severity assessment, 3) Treatment using locally available products in Southeast Asia, 4) Prevention measures. Ask one clarifying question if needed. Description: {{user_text}}"
          style: primary
          hidden_if: "photo_path"
      - markdown_output:
          source: ai_response
          streaming: true
  - id: soil
    title: "{{l10n.soil_title}}"
    body:
      - text_label:
          text: "{{l10n.soil_heading}}"
          style: subheading
      - slider:
          bind: soil_ph
          min: 3
          max: 10
          step: 1
          label: "{{l10n.soil_ph_label}}"
          left_label: "{{l10n.soil_ph_left}}"
          right_label: "{{l10n.soil_ph_right}}"
          show_value: true
      - text_input:
          bind: soil_type
          hint: "{{l10n.soil_type_hint}}"
          input_type: dropdown
          options:
            - "Tanah Liat (Clay)"
            - "Tanah Berpasir (Sandy)"
            - "Tanah Loam"
            - "Tanah Gambut (Peat)"
      - text_input:
          bind: crop_type
          hint: "{{l10n.soil_crop_hint}}"
          input_type: dropdown
          options:
            - "Padi (Rice)"
            - "Sawit (Palm Oil)"
            - "Getah (Rubber)"
            - "Sayur-sayuran (Vegetables)"
            - "Buah-buahan (Fruits)"
            - "Jagung (Corn)"
            - "Ubi Kayu (Cassava)"
      - text_input:
          bind: soil_drainage
          label: "{{l10n.soil_drainage}}"
          input_type: toggle
      - text_input:
          bind: soil_flooding
          label: "{{l10n.soil_flooding}}"
          input_type: toggle
      - text_input:
          bind: soil_failure
          label: "{{l10n.soil_failure}}"
          input_type: toggle
      - action_button:
          label: "{{l10n.soil_button}}"
          action: "ask:You are a soil scientist advising a Southeast Asian farmer. Analyze: Soil pH: {{soil_ph}}, Soil type: {{soil_type}}, Crop: {{crop_type}}, Drainage issues: {{soil_drainage}}, Recent flooding: {{soil_flooding}}, Previous crop failure: {{soil_failure}}. Provide: 1) Soil health assessment, 2) pH correction if needed (lime or sulfur amounts), 3) Fertilizer recommendation (NPK ratio and local brands), 4) Organic amendment suggestions, 5) Planting readiness verdict."
          style: primary
      - markdown_output:
          source: ai_response
          streaming: true
  - id: crop_guide
    title: "{{l10n.crop_title}}"
    body:
      - text_label:
          text: "{{l10n.crop_title}}"
          style: subheading
      - text_input:
          bind: crop_select
          hint: "{{l10n.crop_select_hint}}"
          input_type: dropdown
          options:
            - "Padi (Rice)"
            - "Sawit (Palm Oil)"
            - "Getah (Rubber)"
            - "Durian"
            - "Cili (Chili)"
            - "Tomato"
            - "Jagung (Corn)"
            - "Ubi Kayu (Cassava)"
            - "Kangkung"
            - "Bayam (Spinach)"
      - text_input:
          bind: user_text
          hint: "{{l10n.crop_text_hint}}"
      - action_button:
          label: "{{l10n.crop_button}}"
          action: "ask:You are a crop management advisor for Southeast Asian smallholders. Crop: {{crop_select}}. Provide advice on this question. Include local varieties, tropical climate considerations, planting calendar for Malaysia, common pests and organic solutions. Question: {{user_text}}"
          style: primary
      - markdown_output:
          source: ai_response
          streaming: true
  - id: shops
    title: "{{l10n.shops_title}}"
    body:
      - text_label:
          text: "{{l10n.shops_title}}"
          style: subheading
      - text_label:
          text: "{{l10n.shops_subtext}}"
          style: body
      - action_button:
          label: "{{l10n.shops_locate}}"
          action: "geolocate"
          style: secondary
      - geo_display:
          data: "agro_shops"
          limit: 5
          show_distance: true
      - action_button:
          label: "{{l10n.shops_sms_hotline}}"
          action: "sms:+60197654321:Salam, saya petani perlukan bantuan. Diagnosis AI: {{last_result}}. Tanaman: {{crop_type}}. Lokasi: {{user_location}}. — Dihantar dari Doktor Pokok"
          style: primary
      - action_button:
          label: "{{l10n.shops_call_hotline}}"
          action: "tel:+60197654321"
          style: danger
permissions:
  - camera
  - location
