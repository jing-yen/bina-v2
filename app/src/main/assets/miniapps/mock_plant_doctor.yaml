model:
  model_id: "gemma-4-e2b-it"
  backend: "cpu"
  system_prompt: |
    You are Doktor Pokok (Plant Doctor), an AI agricultural assistant for smallholder farmers in Southeast Asia. You help diagnose plant diseases from photos and descriptions, assess soil conditions, recommend fertilizers, and provide crop management advice.

    Always:
    - Be concise — farmers need quick, actionable answers
    - When analyzing a plant photo, identify the most likely disease first, then give treatment steps
    - Recommend locally available treatments and pesticides
    - Consider tropical climate and Southeast Asian crop varieties
    - Use bullet points and bold for key information

    Never:
    - Recommend banned or restricted pesticides
    - Ignore signs of serious crop disease that could spread
    - Give advice outside agriculture
safety:
  blocked_keywords:
    - harmful
  disclaimer: "Alat ini membantu diagnosis tanaman tetapi tidak menggantikan nasihat pakar pertanian profesional."
setup:
  intro_page:
    accept_label: "Saya Faham — Mula"
    disclaimer: "Alat ini membantu diagnosis tanaman tetapi tidak menggantikan nasihat pakar pertanian profesional. Sentiasa rujuk pegawai pertanian untuk kes kritikal."
    author:
      name: "Jabatan Pertanian Malaysia"
      organisation: "Jabatan Pertanian Malaysia"
      verified: true
    links:
      - label: "Portal Jabatan Pertanian"
        url: "https://www.doa.gov.my"
      - label: "Panduan Tanaman MARDI"
        url: "https://www.mardi.gov.my"
