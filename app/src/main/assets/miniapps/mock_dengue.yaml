  prevention_step: { type: number, default: "0" }
screens:
  - id: home
    title: ""
    body:
      - text_label:
          text: "{{l10n.home_heading}}"
          style: subheading
      - macro_grid:
          columns: 2
          buttons:
            - label: "{{l10n.grid_symptoms}}"
              icon: "\U0001FA7A"
              action: "go:symptoms"
            - label: "{{l10n.grid_prevention}}"
              icon: "\U0001F6E1"
              action: "go:prevention"
            - label: "{{l10n.grid_check}}"
              icon: "\U0001F4CD"
              action: "go:check_area"
            - label: "{{l10n.grid_emergency}}"
              icon: "\U0001F6A8"
              action: "go:emergency"
  - id: symptoms
    title: "{{l10n.symptoms_title}}"
    body:
      - text_label:
          text: "{{l10n.symptoms_heading}}"
          style: subheading
      - voice_input:
          bind: user_text
          hint: "{{l10n.symptoms_voice_hint}}"
      - text_input:
          bind: user_text
          hint: "{{l10n.symptoms_text_hint}}"
      - action_button:
          label: "{{l10n.symptoms_button}}"
          action: "ask:You are a dengue triage assistant following Malaysia MOH guidelines. Assess symptoms for dengue likelihood and urgency. Check for: (1) Warning signs — severe abdominal pain, persistent vomiting, bleeding, rapid breathing, cold clammy skin, restlessness = EMERGENCY go to hospital NOW; (2) Alarm symptoms — fever day 4-7 with improvement then sudden worsening = URGENT see doctor today; (3) Uncomplicated fever day 1-3 = MONITOR at home, stay hydrated, paracetamol only, return if worsening. DO NOT recommend aspirin or ibuprofen. Symptoms reported: {{user_text}}"
          style: primary
      - markdown_output:
          source: ai_response
          streaming: true
  - id: prevention
    title: "{{l10n.prevention_title}}"
    body:
      - text_label:
          text: "{{l10n.prevention_heading}}"
          style: subheading
      - checklist_items:
          bind: prevention_step
          items:
            - label: "{{l10n.prevention_step1}}"
              type: text
            - label: "{{l10n.prevention_step2}}"
              type: text
            - label: "{{l10n.prevention_step3}}"
              type: text
            - label: "{{l10n.prevention_step4}}"
              type: text
            - label: "{{l10n.prevention_step5}}"
              type: text
            - label: "{{l10n.prevention_step6}}"
              type: text
      - progress_bar:
          bind: prevention_step
          total: 6
      - action_button:
          label: "{{l10n.prevention_next}}"
          action: "increment:prevention_step"
          style: primary
      - action_button:
          label: "{{l10n.prevention_report}}"
          action: "ask:Generate a brief dengue prevention inspection report. Steps completed: covered water containers, drained standing water, removed water-collecting items, inspected plants and dark areas, noted use of repellent, confirmed bed nets installed. Provide: 1) Risk level assessment (Low/Moderate/High), 2) Key actions completed, 3) Any remaining recommendations, 4) Report it to local council if breeding sites found."
          style: secondary
          visible_if: "prevention_step >= 6"
      - markdown_output:
          source: ai_response
          streaming: true
  - id: check_area
    title: "{{l10n.check_title}}"
    body:
      - text_label:
          text: "{{l10n.check_title}}"
          style: subheading
      - voice_input:
          bind: user_text
          hint: "{{l10n.check_voice_hint}}"
      - text_input:
          bind: user_text
          hint: "{{l10n.check_text_hint}}"
      - action_button:
          label: "{{l10n.check_button}}"
          action: "ask:You are a dengue vector control advisor. Assess the dengue risk for this area based on environmental description. Evaluate: 1) Potential breeding sites mentioned (stagnant water, tyres, flower pots, drains), 2) Area type risk (dense housing = higher risk), 3) Reported cases nearby if mentioned, 4) Overall risk level (Low/Moderate/High/Critical), 5) Top 3 immediate actions the resident should take, 6) Whether to report to local council (DBKL/MBPJ etc.) for fogging. Description: {{user_text}}"
          style: primary
      - markdown_output:
          source: ai_response
          streaming: true
  - id: emergency
    title: "{{l10n.emergency_title}}"
    body:
      - text_label:
          text: "{{l10n.emergency_title}}"
          style: subheading
      - text_label:
          text: "{{l10n.emergency_subtext}}"
          style: body
      - action_button:
          label: "{{l10n.emergency_hotline}}"
          action: "tel:+60188810000"
          style: danger
      - action_button:
          label: "{{l10n.emergency_call}}"
          action: "geolocate"
          style: secondary
      - geo_display:
          data: "health_clinics"
          limit: 5
          show_distance: true
      - action_button:
          label: "{{l10n.emergency_sms}}"
          action: "sms:+60188810000:Denggi Kecemasan. Pesakit mengalami tanda amaran denggi. Lokasi: {{user_location}}. Sila bantu."
          style: primary
permissions:
  - location
