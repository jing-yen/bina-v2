      ask_button: "提问"
model:
  model_id: "gemma-4-e2b-it"
  backend: "cpu"
  system_prompt: |
    You are a shop management assistant for small Thai retailers (ร้านค้า). You help small shop owners in Thailand with inventory management, profit/loss calculation, pricing strategy, promotion planning, and customer service tips.

    You understand the context of:
    - Thai small retail shops: convenience stores (ร้านโชห่วย), food stalls, market vendors
    - Thai currency (Baht / ฿) and typical Thai product margins
    - Common Thai retail challenges: competition from 7-Eleven/Lotus's, supplier terms, seasonal sales
    - LINE OA (LINE Official Account) as primary marketing channel for Thai SMEs
    - Thai payment methods: PromptPay QR, cash

    Always:
    - Be practical and actionable
    - Use both Thai and English terms where helpful
    - Give specific numbers and calculations when asked
    - Suggest low-cost, high-impact solutions suitable for micro-retailers

    Never:
    - Give tax or legal advice beyond general awareness
    - Recommend strategies that require large capital investment without offering alternatives
safety:
  blocked_keywords:
    - harmful
  disclaimer: "This tool provides general business guidance and is not a substitute for professional financial or legal advice."
setup:
  intro_page:
    accept_label: "เข้าใจแล้ว — เริ่มเลย"
    disclaimer: "ผู้ช่วยร้านค้าให้คำแนะนำทางธุรกิจทั่วไป ไม่ใช่คำแนะนำทางการเงินหรือกฎหมายอย่างเป็นทางการ"
    author:
      name: "Bangkok SME Network"
      organisation: "Bangkok SME Network"
      verified: true
    links:
      - label: "SME D Bank Thailand"
        url: "https://www.smebank.co.th"
      - label: "กรมพัฒนาธุรกิจการค้า"
        url: "https://www.dbd.go.th"
screen_catalog:
  - id: home
    title: "Home"
    icon: "\U0001F3E0"
  - id: inventory
    title: "สต็อก"
    icon: "\U0001F4E6"
  - id: profit
    title: "กำไร"
    icon: "\U0001F4B0"
  - id: promo
    title: "โปรโมชั่น"
    icon: "\U0001F3AF"
  - id: ask_assistant
    title: "ถาม"
    icon: "\U0001F4AC"
variables:
  user_text: { type: string, default: "" }
  ai_response: { type: string, default: "" }
  product_name: { type: string, default: "" }
  stock_qty: { type: string, default: "" }
  cost_price: { type: string, default: "" }
  sell_price: { type: string, default: "" }
  daily_overhead: { type: string, default: "" }
  daily_units: { type: string, default: "" }
  shop_type: { type: string, default: "" }
  promo_budget: { type: string, default: "" }
  promo_goal: { type: string, default: "" }
screens:
  - id: home
    title: ""
    body:
      - text_label:
          text: "{{l10n.home_heading}}"
          style: subheading
      - macro_grid:
          columns: 2
          buttons:
            - label: "{{l10n.grid_inventory}}"
              icon: "\U0001F4E6"
              action: "go:inventory"
            - label: "{{l10n.grid_profit}}"
              icon: "\U0001F4B0"
              action: "go:profit"
            - label: "{{l10n.grid_promo}}"
              icon: "\U0001F3AF"
              action: "go:promo"
            - label: "{{l10n.grid_ask}}"
              icon: "\U0001F4AC"
              action: "go:ask_assistant"
  - id: inventory
    title: "{{l10n.inventory_title}}"
    body:
      - text_label:
          text: "{{l10n.inventory_heading}}"
          style: subheading
      - text_input:
          bind: product_name
          hint: "{{l10n.inventory_product_hint}}"
          input_type: dropdown
          options:
            - "เครื่องดื่ม / Beverages"
            - "ขนมขบเคี้ยว / Snacks"
            - "ของชำ / Grocery"
            - "ของใช้ในบ้าน / Household"
            - "เครื่องสำอาง / Cosmetics"
            - "อาหารแช่แข็ง / Frozen Food"
            - "สินค้าอื่น / Other"
      - text_input:
          bind: stock_qty
          hint: "{{l10n.inventory_qty_hint}}"
      - action_button:
          label: "{{l10n.inventory_button}}"
          action: "ask:You are an inventory advisor for a small Thai shop. Product category: {{product_name}}, Current stock: {{stock_qty}} units. Provide: 1) Whether to reorder now (typical reorder point for this category), 2) Suggested reorder quantity (Economic Order Quantity principle, simplified), 3) Typical shelf life / expiry risk for this category, 4) Storage tips, 5) Whether this category is worth continuing to stock based on typical margins. Give practical advice in simple terms."
          style: primary
      - markdown_output:
          source: ai_response
          streaming: true
  - id: profit
    title: "{{l10n.profit_title}}"
    body:
      - text_label:
          text: "{{l10n.profit_heading}}"
          style: subheading
      - text_input:
          bind: cost_price
          hint: "{{l10n.profit_cost_hint}}"
      - text_input:
          bind: sell_price
          hint: "{{l10n.profit_price_hint}}"
      - text_input:
          bind: daily_overhead
          hint: "{{l10n.profit_overhead_hint}}"
      - text_input:
          bind: daily_units
          hint: "{{l10n.profit_units_hint}}"
      - action_button:
          label: "{{l10n.profit_button}}"
          action: "ask:Calculate profit for a small Thai shop. Cost price: {{cost_price}} Baht, Selling price: {{sell_price}} Baht, Daily overhead: {{daily_overhead}} Baht, Units sold per day: {{daily_units}}. Calculate: 1) Gross profit per unit (Baht and %), 2) Daily gross profit, 3) Daily net profit after overhead, 4) Monthly net profit estimate, 5) Break-even units per day, 6) Is this margin sustainable for a Thai small shop? (Compare to typical 10-30% retail margin). Give clear numbers."
          style: primary
      - markdown_output:
          source: ai_response
          streaming: true
  - id: promo
    title: "{{l10n.promo_title}}"
    body:
      - text_label:
          text: "{{l10n.promo_title}}"
          style: subheading
      - text_input:
          bind: shop_type
          hint: "{{l10n.promo_type_hint}}"
          input_type: dropdown
          options:
            - "ร้านโชห่วย (Convenience store)"
            - "ร้านอาหาร (Food stall)"
            - "ร้านตลาด (Market stall)"
            - "ร้านออนไลน์ (Online shop)"
            - "ร้านค้าปลีกอื่น (Other retail)"
      - text_input:
          bind: promo_budget
          hint: "{{l10n.promo_budget_hint}}"
      - text_input:
          bind: promo_goal
          hint: "{{l10n.promo_goal_hint}}"
      - action_button:
          label: "{{l10n.promo_button}}"
          action: "ask:You are a Thai retail marketing advisor. Shop type: {{shop_type}}, Promotion budget: {{promo_budget}} Baht, Goal: {{promo_goal}}. Design a practical promotion plan: 1) Top 2-3 promotion ideas within budget (e.g. LINE OA promotion, buy-1-get-1, loyalty card, seasonal discount), 2) How to execute each idea step-by-step, 3) Expected customer response, 4) How to measure success, 5) Common Thai promotion mistakes to avoid."
          style: primary
      - markdown_output:
          source: ai_response
          streaming: true
  - id: ask_assistant
    title: "{{l10n.ask_title}}"
    body:
      - text_label:
          text: "{{l10n.ask_title}}"
          style: subheading
      - voice_input:
          bind: user_text
          hint: "{{l10n.ask_voice_hint}}"
      - text_input:
          bind: user_text
          hint: "{{l10n.ask_text_hint}}"
      - action_button:
          label: "{{l10n.ask_button}}"
          action: "ask:{{user_text}}"
          style: primary
      - markdown_output:
          source: ai_response
          streaming: true
