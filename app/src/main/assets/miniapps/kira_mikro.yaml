model:
  model_id: "gemma-4-e2b-it"
  backend: "cpu"
  system_prompt: |
    You are Kira Mikro, a personal financial assistant for small warung (shop) operators and micro-enterprise owners in Southeast Asia.

    You understand:
    - Buku 555 (the common handwritten debt ledger used by Malaysian traders)
    - RM (Ringgit Malaysia) currency formatting
    - SST (Sales & Services Tax) at 6%
    - Common warung items: nasi lemak, mee goreng, teh tarik, roti canai, milo, kuih
    - Simple profit/loss calculations for daily trading
    - Debt tracking and payment reminders

    Always:
    - Use RM formatting (RM 12.50, not $12.50)
    - Give answers in simple language a warung owner understands
    - Present financial summaries in clear tables
    - Round to 2 decimal places
    - Include profit margin percentages where relevant

    Never:
    - Give investment or stock market advice
    - Recommend loans or credit facilities
    - Provide tax planning beyond basic SST
    - Suggest business expansion strategies
safety:
  blocked_keywords:
    - pinjaman haram
    - skim cepat kaya
    - pelaburan saham
    - forex
    - crypto
    - investment
  escalation_message: "Kira Mikro tidak boleh memberi nasihat pelaburan atau pinjaman. Sila rujuk penasihat kewangan berlesen."
  disclaimer: "Alat bantuan kewangan warung. Bukan nasihat kewangan profesional."
setup:
  intro_page:
    accept_label: "Saya Faham — Mula"
    disclaimer: "Kira Mikro membantu mengurus kewangan warung anda. Ini bukan nasihat kewangan profesional. Untuk hal percukaian dan pelaburan, sila rujuk akauntan bertauliah."
    author:
      name: "Pn. Siti Hajar"
      organisation: "Koperasi Usahawan Mikro Kelantan"
      verified: true
    links:
      - label: "Portal SME Corp Malaysia"
        url: "https://www.smecorp.gov.my"
      - label: "Panduan Cukai LHDN"
        url: "https://www.hasil.gov.my"
screen_catalog:
  - id: home
    title: "Home"
    icon: "\U0001F3E0"
  - id: rekod_jualan
    title: "Rekod"
    icon: "\U0001F4DD"
  - id: kira_untung
    title: "Untung"
    icon: "\U0001F4B5"
  - id: imbas_hutang
    title: "Hutang"
    icon: "\U0001F4F7"
  - id: tanya_kira
    title: "Tanya"
    icon: "\U0001F4AC"
variables:
  user_text: { type: string, default: "" }
  ai_response: { type: string, default: "" }
  photo_path: { type: string, default: "" }
  item_name: { type: string, default: "" }
  item_qty: { type: number, default: "0" }
  item_price: { type: number, default: "0" }
  calc_jualan: { type: number, default: "0" }
  calc_kos: { type: number, default: "0" }
  calc_result: { type: number, default: "0" }
  include_sst: { type: string, default: "false" }
formulas:
  profit:
    expression: "{{calc_jualan}} - {{calc_kos}}"
    output: calc_result
  profit_sst:
    expression: "({{calc_jualan}} - {{calc_kos}}) * (1 - 6 / 100)"
    output: calc_result
screens:
  - id: home
    title: ""
    body:
      - text_label:
          text: "{{l10n.home_heading}}"
          style: subheading
      - macro_grid:
          columns: 2
          buttons:
            - label: "{{l10n.grid_rekod}}"
              icon: "\U0001F4DD"
              action: "go:rekod_jualan"
            - label: "{{l10n.grid_kira}}"
              icon: "\U0001F4B5"
              action: "go:kira_untung"
            - label: "{{l10n.grid_hutang}}"
              icon: "\U0001F4F7"
              action: "go:imbas_hutang"
            - label: "{{l10n.grid_tanya}}"
              icon: "\U0001F4AC"
              action: "go:tanya_kira"
  - id: rekod_jualan
    title: "{{l10n.rekod_title}}"
    body:
      - text_label:
          text: "{{l10n.rekod_title}}"
          style: subheading
      - text_input:
          bind: item_name
          hint: "{{l10n.rekod_item_hint}}"
      - text_input:
          bind: item_qty
          hint: "{{l10n.rekod_qty_hint}}"
          input_type: number
      - text_input:
          bind: item_price
          hint: "{{l10n.rekod_price_hint}}"
          input_type: number
      - action_button:
          label: "{{l10n.rekod_button}}"
          action: "ask:Rekod jualan warung hari ini. Item: {{item_name}}, Bilangan: {{item_qty}}, Harga: RM{{item_price}} seunit. Kira jumlah untuk item ini, tunjukkan pengiraan, dan beri ringkasan harian. Format sebagai jadual ringkas."
          style: primary
      - markdown_output:
          source: ai_response
          streaming: true
  - id: kira_untung
    title: "{{l10n.kira_title}}"
    body:
      - text_label:
          text: "{{l10n.kira_heading}}"
          style: subheading
      - text_input:
          bind: calc_jualan
          hint: "{{l10n.kira_jualan_hint}}"
          input_type: number
      - text_input:
          bind: calc_kos
          hint: "{{l10n.kira_kos_hint}}"
          input_type: number
      - text_input:
          bind: include_sst
          label: "{{l10n.kira_sst}}"
          input_type: toggle
      - action_button:
          label: "{{l10n.kira_button}}"
          action: "formula:profit"
          style: primary
          hidden_if: "include_sst"
      - action_button:
          label: "{{l10n.kira_button}}"
          action: "formula:profit_sst"
          style: primary
          visible_if: "include_sst"
      - metric_card:
          source: calc_result
          label: "{{l10n.kira_result_label}}"
          prefix: "RM "
          visible_if: calc_result
  - id: imbas_hutang
    title: "{{l10n.hutang_title}}"
    body:
      - text_label:
          text: "{{l10n.hutang_heading}}"
          style: subheading
      - camera_input:
          bind: photo_path
      - text_input:
          bind: user_text
          hint: "{{l10n.hutang_hint}}"
      - action_button:
          label: "{{l10n.hutang_button}}"
          action: "vision_ask:Analisis gambar buku hutang (Buku 555) ini. Senaraikan: 1) Nama penghutang, 2) Jumlah hutang (dalam RM), 3) Tarikh hutang jika ada, 4) Status (belum bayar / separuh bayar). Akhir sekali, beri jumlah keseluruhan hutang tertunggak. Format sebagai jadual."
          style: primary
          visible_if: "photo_path"
      - action_button:
          label: "{{l10n.hutang_button}}"
          action: "ask:Bantu saya menganalisis rekod hutang warung saya. Maklumat: {{user_text}}. Tolong senaraikan nama, jumlah, dan cadangan peringatan pembayaran. Format sebagai jadual."
          style: primary
          hidden_if: "photo_path"
      - markdown_output:
          source: ai_response
          streaming: true
  - id: tanya_kira
    title: "{{l10n.tanya_title}}"
    body:
      - text_label:
          text: "{{l10n.tanya_title}}"
          style: subheading
      - voice_input:
          bind: user_text
          hint: "{{l10n.tanya_voice_hint}}"
      - text_input:
          bind: user_text
          hint: "{{l10n.tanya_text_hint}}"
      - action_button:
          label: "{{l10n.tanya_button}}"
          action: "ask:{{user_text}}"
          style: primary
      - markdown_output:
          source: ai_response
          streaming: true
permissions:
  - camera
